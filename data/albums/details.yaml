    stories:
      - tag: SESSION
        title: Two days, barely rehearsed
        body: >-
          Recorded March 2 and April 22, 1959 at Columbia's 30th Street Studio. Most of the players
          saw Davis's sketches for the first time at the date.
      - tag: LINER NOTES
        title: Evans writes the sleeve
        body: >-
          Bill Evans's original notes compare the sessions to a Japanese painting discipline: one
          stroke, no erasing, no going back.
      - tag: PRESSING
        title: Side one ran fast
        body: >-
          A tape machine running slow meant the first three tracks were issued slightly sharp.
          Corrected-speed masters came decades later.
