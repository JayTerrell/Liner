albums:
  kind-of-blue:
    tracks:
      - 'n': 1
        title: So What
        len: '9:05'
        note: Bass asks, horns answer. Two scales, sixteen bars each, endless room.
      - 'n': 2
        title: Freddie Freeloader
        len: '9:36'
        note: Wynton Kelly sits in on piano. The bluesiest stop on the record.
      - 'n': 3
        title: Blue in Green
        len: '5:29'
        note: A ten-bar cycle with no obvious top. Evans and Davis at their quietest.
      - 'n': 4
        title: All Blues
        len: '11:34'
        note: A 6/8 blues that floats instead of swings.
      - 'n': 5
        title: Flamenco Sketches
        len: '9:25'
        note: Five scales. Each soloist decides when to move on.
