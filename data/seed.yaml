artists:
  - id: miles-davis
    name: Miles Davis
    roles: Trumpeter · bandleader · composer
    years: 1926–1991
    lanes:
      - jazz
    bio: >-
      A bandleader who kept changing the sound of jazz: cool, hard bop, modal, then electric. Many musicians from his
      groups went on to lead their own.
    before:
      - name: Charlie Parker
        note: Miles played in his quintet in the late 1940s
      - name: Gil Evans
        note: arranger and long-time collaborator
    after:
      - id: john-coltrane
        note: tenor saxophonist in the late-1950s quintet
      - id: bill-evans
        note: pianist on Kind of Blue
      - id: herbie-hancock
        note: pianist in the 1960s quintet
  - id: john-coltrane
    name: John Coltrane
    roles: Saxophonist · composer
    years: 1926–1967
    lanes:
      - jazz
    bio: >-
      Moved from hard bop through modal playing to spiritual, open-ended jazz. A Love Supreme is the record most
      listeners start with.
    before:
      - id: miles-davis
        note: played in his quintet
      - id: thelonious-monk
        note: worked with Monk in 1957
    after:
      - name: Pharoah Sanders
        note: played in Coltrane's later groups
      - name: Alice Coltrane
        note: pianist and composer
  - id: bill-evans
    name: Bill Evans
    roles: Pianist · composer
    years: 1929–1980
    lanes:
      - jazz
    bio: >-
      Known for quiet, open voicings and a trio style where piano, bass and drums converse. He played on Kind of Blue
      and wrote its original liner notes.
    before:
      - id: miles-davis
        note: Kind of Blue, 1959
    after:
      - name: Later jazz pianists
        note: his voicings became a shared vocabulary
  - id: thelonious-monk
    name: Thelonious Monk
    roles: Pianist · composer
    years: 1917–1982
    lanes:
      - jazz
    bio: A composer with an unmistakable angular piano style. Many of his tunes became jazz standards.
    before:
      - name: Duke Ellington
        note: an early touchstone
    after:
      - id: john-coltrane
        note: played with Monk in 1957
  - id: charles-mingus
    name: Charles Mingus
    roles: Bassist · composer · bandleader
    years: 1922–1979
    lanes:
      - jazz
    bio: A bassist and composer who blended gospel, blues and composition with raw, big-band energy.
