paths:
  - id: miles-davis-journey
    kind: journey
    badge: ENTHUSIAST JOURNEY
    title: The Miles Davis Journey
    host: Jay
    sample: true
    blurb: >-
      I'm listening through Miles Davis's catalog to understand how his sound, collaborators and ideas changed over
      time. I'm inviting other curious listeners to learn alongside me.
    meta: 24 albums · weekly · 86 along
    along: 86
    done: 10
    cadence: Weekly · Tuesdays 8 PM ET
    whyNext: >-
      I want to hear what changes after 'Round About Midnight, and how this record starts moving toward the modal
      language I expect to hear fully on Kind of Blue.
    listenFor:
      - The role of the rhythm section
      - How Miles approaches space
      - What changed in the personnel and feel
    items:
      - title: Birth of the Cool
        artist: Miles Davis
        year: '1949'
      - title: Dig
        artist: Miles Davis
        year: '1951'
      - title: Walkin'
        artist: Miles Davis
        year: '1954'
        mbid: 01ec3c28-cba3-3c7d-b4af-0cfc7ad8ddc4
      - title: Bags' Groove
