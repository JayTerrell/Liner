kindOfBlue:
  tracks:
    - 'n': 1
      title: So What
      len: '9:22'
      note: Bass asks, horns answer. Two scales, sixteen bars each, endless room.
    - 'n': 2
      title: Freddie Freeloader
      len: '9:46'
      note: Wynton Kelly sits in on piano. The bluesiest stop on the record.
    - 'n': 3
      title: Blue in Green
      len: '5:37'
      note: A ten-bar cycle with no obvious top. Evans and Davis at their quietest.
    - 'n': 4
      title: All Blues
      len: '11:33'
      note: A 6/8 blues that floats instead of swings.
    - 'n': 5
      title: Flamenco Sketches
      len: '9:26'
      note: Five scales. Each soloist decides when to move on.
  credits:
    - name: Miles Davis
      role: Trumpet, leader
      scope: All tracks
      artistId: miles-davis
    - name: John Coltrane
      role: Tenor saxophone
      scope: All tracks
      artistId: john-coltrane
    - name: Cannonball Adderley
      role: Alto saxophone
      scope: Tracks 1, 2, 4, 5
    - name: Bill Evans
      role: Piano
      scope: Tracks 1, 3, 4, 5
      artistId: bill-evans
    - name: Wynton Kelly
      role: Piano
      scope: Track 2
    - name: Paul Chambers
      role: Bass
      scope: All tracks
    - name: Jimmy Cobb
      role: Drums
      scope: All tracks
    - name: Teo Macero, Irving Townsend
      role: Producers
      scope: Session
    - name: Fred Plaut
      role: Recording engineer
      scope: 30th St. Studio
  stories:
    - tag: SESSION
      title: Two days, barely rehearsed
      body: >-
        Recorded March 2 and April 22, 1959 at Columbia's 30th Street Studio. Most of the players saw Davis's sketches
        for the first time at the date.
    - tag: LINER NOTES
      title: Evans writes the sleeve
      body: >-
        Bill Evans's original notes compare the sessions to a Japanese painting discipline: one stroke, no erasing, no
        going back.
    - tag: PRESSING
      title: Side one ran fast
      body: >-
        A tape machine running slow meant the first three tracks were issued slightly sharp. Corrected-speed masters
        came decades later.
